<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width" />
		
		<script>
			const onLoadRes = (elementName, url, successCallbakc, errorCallback) => {
				let script = document.createElement(elementName);
				
                if (elementName === "script") {
                    script.src = url;
				    script.type = "application/javascript";
                } else {
                    script.href = url;
				    script.rel = "stylesheet";
				    script.type = "text/css";
                }
				

				script.onload = function() {
					if (typeof successCallbakc === "function")
						successCallbakc ()
				};
				
				script.onerror = function() {
					if (typeof errorCallback === "function")
						errorCallback ()
				};

				document.head.append(script);
			}
						
			const buildDirectories = { main: 'build', ru: 'buildru', en: 'builden' };
			const requestedLanguage = new URLSearchParams(window.location.search).get('lang');
			const buildDirectory = buildDirectories[requestedLanguage] || buildDirectories.main;

			const loadRes = (url) => {
				document.cloud = url + "/cloud/";
				onLoadRes('script', url + `/${buildDirectory}/bundle.js`);
			}


			console.log('Start')

			onLoadRes('link', `https://cdn-ra3.ragemp.pro/${buildDirectory}/bundle.css`, () => {
					loadRes ("https://cdn-ra3.ragemp.pro")
				}, (element) => {
				    console.log('Fail Rus Cdn')
					onLoadRes('link', `https://cdn.ragemp.pro/${buildDirectory}/bundle.css`, () => {
							loadRes ("https://cdn.ragemp.pro")
						}, (element) => {
						    console.log('Fail Global Cdn')
                        }
                    )
                }
            )
		</script>
    </head>

    </body>
</html>
