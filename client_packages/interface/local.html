<!doctype html>
<html>
<head>
	<meta charset='utf8'>
	<meta name='viewport' content='width=device-width'>    
</head>
<body>
	<script>
		const buildDirectories = { main: 'build', ru: 'buildru', en: 'builden' };
		const requestedLanguage = new URLSearchParams(window.location.search).get('lang');
		const buildDirectory = buildDirectories[requestedLanguage] || buildDirectories.main;

		document.cloud = "https://cdn-ra3.ragemp.pro/cloud/";

		const loadBundle = () => {
			if (window.__redageBundleLoaded)
				return;

			window.__redageBundleLoaded = true;
			const script = document.createElement('script');
			script.type = 'application/javascript';
			script.src = `${buildDirectory}/bundle.js`;
			document.body.append(script);
		};

		const stylesheet = document.createElement('link');
		stylesheet.rel = 'stylesheet';
		stylesheet.type = 'text/css';
		stylesheet.href = `${buildDirectory}/bundle.css`;
		stylesheet.onload = loadBundle;
		stylesheet.onerror = () => {
			console.error(`[RedAge CEF] Failed to load ${stylesheet.href}`);
			loadBundle();
		};
		document.head.append(stylesheet);
	</script>
</body>
</html>
